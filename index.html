<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GATE CSE 2027 — Prep Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F1720'/%3E%3Cpath d='M32 14 L54 24 L32 34 L10 24 Z' fill='%2345C4B0'/%3E%3Cpath d='M20 29 V41 C20 45 26 48 32 48 C38 48 44 45 44 41 V29 L32 34 Z' fill='%23F0A93B'/%3E%3Cline x1='54' y1='24' x2='54' y2='38' stroke='%2345C4B0' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='54' cy='40' r='2.5' fill='%2345C4B0'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  color-scheme: dark;
  --bg:#0F1419;
  --surface:#161D26;
  --surface-2:#1E2733;
  --border:#2A3441;
  --amber:#F0A93B;
  --teal:#45C4B0;
  --rose:#E8615F;
  --green:#5FD068;
  --text:#EAEFF5;
  --muted:#8B96A8;
  --muted-2:#5C6678;
}

[data-theme="light"]{
  color-scheme: light;
  --bg:#F4F6F9;
  --surface:#FFFFFF;
  --surface-2:#EAEEF3;
  --border:#DCE3EA;
  --amber:#C97A1A;
  --teal:#12897A;
  --rose:#C7413F;
  --green:#1E9E4A;
  --text:#1B2430;
  --muted:#5C6678;
  --muted-2:#8B96A8;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding:28px 16px 80px;
}

.wrap{max-width:920px;margin:0 auto;}

/* ---------- Header ---------- */
header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:16px;
  margin-bottom:24px;
  padding-bottom:20px;
  border-bottom:1px solid var(--border);
}
.title-block .eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:0.16em;
  color:var(--teal);
  text-transform:uppercase;
  margin-bottom:6px;
}
.title-block h1{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:28px;
  letter-spacing:-0.01em;
}
.countdown{text-align:right;font-family:'JetBrains Mono',monospace;}
.countdown .num{font-size:36px;font-weight:700;color:var(--amber);line-height:1;}
.countdown .lbl{font-size:11px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-top:4px;}
.countdown input{
  background:none;border:none;border-bottom:1px dashed var(--muted-2);
  color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;
  margin-top:6px;padding:2px 0;width:120px;text-align:right;
}
.countdown input:focus{outline:none;border-bottom-color:var(--teal);color:var(--text);}

.header-right{display:flex;align-items:flex-end;gap:14px;}
.theme-toggle{
  background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
  width:36px;height:36px;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--text);
  flex-shrink:0;
}
.theme-toggle:hover{border-color:var(--teal);}

/* ---------- Stat bar ---------- */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:28px;
}
.stat-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px 16px;
}
.stat-card .val{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;}
.stat-card .val.amber{color:var(--amber);}
.stat-card .val.teal{color:var(--teal);}
.stat-card .lbl{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3;}
.stat-card.target-card{display:flex;flex-direction:column;justify-content:space-between;}
.target-date-row{margin-top:8px;}
.target-date-row label{
  display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted-2);
  letter-spacing:0.06em;text-transform:uppercase;margin-bottom:3px;
}
.target-date-row input{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 6px;border-radius:5px;width:100%;
}
.target-date-row input:focus{outline:none;border-color:var(--teal);}

/* ---------- Section head ---------- */
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px;flex-wrap:wrap;}
.section-head h2{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;}
.hide-skipped-btn{
  background:var(--surface-2);border:1px solid var(--border);color:var(--muted);
  font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.02em;
  padding:6px 11px;border-radius:20px;cursor:pointer;white-space:nowrap;
  transition:all .15s ease;
}
.hide-skipped-btn:hover{border-color:var(--teal);color:var(--teal);}
.hide-skipped-btn.active{border-color:var(--rose);color:var(--rose);background:color-mix(in srgb, var(--rose) 10%, var(--surface-2));}

/* ---------- Subject cards ---------- */
.subjects{display:flex;flex-direction:column;gap:10px;}

.subject-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.subject-head{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 18px;
  cursor:pointer;
  user-select:none;
}
.subject-head .chevron{
  font-size:12px;
  color:var(--muted-2);
  transition:transform .2s ease;
  flex-shrink:0;
  width:12px;
}
.subject-card.open .chevron{transform:rotate(90deg);}

.subject-main{flex:1;min-width:0;}
.subject-name-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;}
.subject-name-row .name{
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;
  font-size:15px;
}
.subject-name-row .figure{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
}
.subject-name-row .figure .pct{color:var(--amber);font-weight:700;}
.subject-name-row .figure .pct.done{color:var(--green);}

.bar-track{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width .35s ease, background-color .2s ease;}
.bar-fill.amber{background:var(--amber);}
.bar-fill.teal{background:var(--teal);}
.bar-fill.done{background:var(--green);}

.modules-wrap{
  display:none;
  border-top:1px solid var(--border);
  padding:6px 18px 14px;
}
.subject-card.open .modules-wrap{display:block;}

.module-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.module-row:last-child{border-bottom:none;}

.module-check{
  width:18px;height:18px;
  border-radius:5px;
  border:2px solid var(--muted-2);
  background:var(--surface-2);
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--bg);
  cursor:pointer;
  transition:all .15s ease;
}
.module-check:hover{border-color:var(--amber);}
.module-check.done{background:var(--amber);border-color:var(--amber);}

.module-body{flex:1;min-width:0;}
.module-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.module-name{font-size:13px;color:var(--text);}
.module-hrs{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
}
.module-hrs .at-max{color:var(--amber);}
.hrs-input{
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  width:52px;
  padding:2px 4px;
  border-radius:5px;
  text-align:right;
}
.hrs-input:focus{outline:none;border-color:var(--teal);}

.module-bar-row{display:flex;align-items:center;gap:8px;}
.module-controls{display:flex;gap:4px;flex-shrink:0;}
.module-controls button{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  font-family:'JetBrains Mono',monospace;font-size:10px;
  padding:2px 7px;border-radius:5px;cursor:pointer;white-space:nowrap;
}
.module-controls button:hover:not(:disabled){border-color:var(--teal);color:var(--teal);}
.module-controls button:disabled{opacity:0.35;cursor:not-allowed;}

/* ---------- Skipped modules ---------- */
.module-row.skipped{opacity:0.5;}
.module-row.skipped .module-name{text-decoration:line-through;color:var(--muted);}
.module-row.skipped .bar-fill{background:var(--muted-2) !important;}
.skipped-badge{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--muted-2);border:1px solid var(--border);border-radius:4px;
  padding:1px 5px;vertical-align:middle;margin-left:6px;
  text-decoration:none;display:inline-block;
}
.skip-btn{color:var(--muted-2) !important;border-color:var(--border) !important;}
.skip-btn:hover:not(:disabled){color:var(--rose) !important;border-color:var(--rose) !important;}
.unskip-btn{color:var(--teal) !important;border-color:var(--teal) !important;font-weight:600;}
.unskip-btn:hover:not(:disabled){opacity:0.8;}

/* ---------- Fully-skipped subjects ---------- */
.subject-card.fully-skipped{opacity:0.5;filter:grayscale(0.6);}
.subject-card.fully-skipped .subject-head{cursor:pointer;}
.subject-card.fully-skipped .subject-name-row .name{text-decoration:line-through;color:var(--muted);}
.subject-card.fully-skipped .bar-fill{background:var(--muted-2) !important;}

/* ---------- Fully-completed subjects ---------- */
.subject-card.fully-done{opacity:0.72;}
.subject-card.fully-done .subject-name-row .name{color:var(--muted);}
.subject-card.fully-done .subject-name-row .name::after{
  content:'✓';margin-left:6px;color:var(--green);font-weight:700;
}

footer{
  text-align:center;
  margin-top:40px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted-2);
}
footer button{
  background:none;border:none;color:var(--muted-2);text-decoration:underline;
  cursor:pointer;font-family:inherit;font-size:inherit;
}
footer button:hover{color:var(--rose);}
footer button.confirming{color:var(--rose);text-decoration:none;font-weight:700;}
.footer-row{margin-top:6px;}
.footer-row:first-child{margin-top:0;}
.file-note{color:var(--muted-2);}
.file-note.linked{color:var(--teal);}
.file-note strong{color:var(--text);font-weight:600;}

/* ---------- Daily Log ---------- */
.log-total{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);}
.log-hint{font-size:12px;color:var(--muted-2);margin-bottom:10px;line-height:1.4;}
.log-form{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px 18px;
  margin-bottom:14px;
}
.log-form-row{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap;}
.log-field{flex:1;min-width:130px;}
.log-form label{
  display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted-2);
  letter-spacing:0.06em;text-transform:uppercase;margin-bottom:5px;
}
.log-form input, .log-form textarea{
  width:100%;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  font-family:'Inter',sans-serif;font-size:13px;padding:7px 9px;border-radius:7px;
}
.log-form input:focus, .log-form textarea:focus{outline:none;border-color:var(--teal);}
.log-form textarea{resize:vertical;margin-bottom:12px;font-family:'Inter',sans-serif;}
.log-form-actions button{
  background:var(--teal);border:none;color:var(--bg);font-weight:600;
  font-family:'Space Grotesk',sans-serif;font-size:13px;
  padding:8px 16px;border-radius:7px;cursor:pointer;
}
.log-form-actions button:hover{opacity:0.9;}
.log-form-actions #cancelLogEditBtn{
  background:none;color:var(--muted);margin-left:8px;font-weight:500;
}
.log-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
.log-empty{color:var(--muted-2);font-size:13px;padding:8px 2px;}
.log-entry{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:12px 16px;
}
.log-entry-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;}
.log-date{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;}
.log-hours{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--teal);white-space:nowrap;}

.session-list{display:flex;flex-direction:column;gap:10px;}
.session-empty{color:var(--muted-2);font-size:12px;}
.session-item{
  padding:10px 12px;background:var(--surface-2);border-radius:8px;
  border:1px solid var(--border);
}
.session-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;}
.session-time{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted-2);}
.session-tag{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  border:1px solid;border-radius:10px;padding:1px 8px;white-space:nowrap;
}
.session-note{font-size:13px;color:var(--text);white-space:pre-wrap;line-height:1.4;}
.session-actions{margin-top:7px;display:flex;gap:12px;}
.session-actions button{
  background:none;border:none;color:var(--muted-2);font-size:11px;
  font-family:'JetBrains Mono',monospace;cursor:pointer;text-decoration:underline;
}
.session-actions button:hover{color:var(--teal);}
.session-actions button.deleteSessionBtn:hover{color:var(--rose);}
.session-actions button.confirming{color:var(--rose);text-decoration:none;font-weight:700;}

/* ---------- Edit syllabus hours (separate from the Subjects section) ---------- */
.targets-section{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:4px 18px 4px;margin-top:24px;margin-bottom:20px;
}
.targets-section > summary{padding:14px 0;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer;}
.targets-hint{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 14px;}
.targets-subject{border-top:1px solid var(--border);padding:10px 0;}
.targets-subject > summary{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;cursor:pointer;padding:4px 0;}
.targets-modules{margin-top:10px;display:flex;flex-direction:column;gap:9px;padding-left:2px;padding-bottom:6px;}
.target-row{display:flex;align-items:center;gap:8px;font-size:13px;}
.target-name{flex:1;color:var(--text);}
.target-row input.targetHoursInput{
  width:70px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  font-family:'JetBrains Mono',monospace;font-size:12px;padding:5px 7px;border-radius:6px;text-align:right;
}
.target-row input.targetHoursInput:focus{outline:none;border-color:var(--teal);}
.target-unit{color:var(--muted-2);font-family:'JetBrains Mono',monospace;font-size:11px;width:10px;}

/* ---------- Custom modal (replaces window.alert/confirm/prompt) ----------
   Native dialogs get silently blocked in sandboxed preview frames (e.g. when
   testing the file directly inside a chat interface rather than a real
   top-level browser tab), so every interactive dialog in this app uses this
   instead — it's just DOM/CSS, so it works identically everywhere. */
.cm-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;
}
.cm-box{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:20px;max-width:400px;width:100%;
  box-shadow:0 12px 40px rgba(0,0,0,0.5);
}
.cm-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;margin-bottom:8px;}
.cm-message{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:14px;white-space:pre-wrap;}
.cm-input{
  width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  font-family:'Inter',sans-serif;font-size:13px;padding:9px 11px;border-radius:8px;
  margin-bottom:16px;resize:vertical;
}
.cm-input:focus{outline:none;border-color:var(--teal);}
.cm-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;}
.cm-btn{
  font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;
  padding:8px 16px;border-radius:8px;cursor:pointer;border:none;
}
.cm-btn-primary{background:var(--teal);color:var(--bg);}
.cm-btn-primary:hover{opacity:0.9;}
.cm-btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.cm-btn-secondary:hover{border-color:var(--teal);}

.log-details{margin-top:6px;margin-bottom:8px;}
.log-details summary{
  cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);
  padding:8px 2px;list-style:none;
}
.log-details summary::marker{display:none;}
.log-details summary::-webkit-details-marker{display:none;}
.log-details summary::before{content:'▶ ';display:inline-block;transition:transform .2s ease;}
.log-details[open] summary::before{transform:rotate(90deg);}
.log-details .log-list{margin-top:10px;margin-bottom:0;}

@media(max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr);}
  header{flex-direction:column;align-items:flex-start;}
  .countdown{text-align:left;}
  .header-right{width:100%;justify-content:space-between;}
  .module-row{flex-wrap:wrap;}
  .wk-bars{gap:5px;}
  .wk-bar-track{max-width:22px;}
}
</style>
</head>

    overlay.className = 'cm-overlay';
    const inputHtml = input
      ? (textarea
          ? `<textarea class="cm-input" rows="3" placeholder="${escapeHtml(inputPlaceholder)}">${escapeHtml(inputValue)}</textarea>`
          : `<input class="cm-input" type="text" placeholder="${escapeHtml(inputPlaceholder)}" value="${escapeHtml(inputValue)}">`)
      : '';
    overlay.innerHTML = `
      <div class="cm-box">
        ${title ? `<div class="cm-title">${escapeHtml(title)}</div>` : ''}
        ${message ? `<div class="cm-message">${escapeHtml(message)}</div>` : ''}
        ${inputHtml}
        <div class="cm-actions">
          ${buttons.map((b,i) => `<button class="cm-btn ${b.variant==='primary'?'cm-btn-primary':'cm-btn-secondary'}" data-idx="${i}">${escapeHtml(b.label)}</button>`).join('')}
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const inputEl = overlay.querySelector('.cm-input');
    if(inputEl) inputEl.focus();

    function finish(value){
      overlay.remove();
      document.removeEventListener('keydown', escHandler);
      resolve(value);
    }
    overlay.querySelectorAll('.cm-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const chosen = buttons[Number(btn.dataset.idx)];
        finish(chosen.returnsInput ? (inputEl ? inputEl.value : '') : chosen.value);
      });
    });
    function escHandler(e){ if(e.key === 'Escape') finish(null); }
    document.addEventListener('keydown', escHandler);
    overlay.addEventListener('click', e => { if(e.target === overlay) finish(null); });
    if(inputEl && !textarea){
      inputEl.addEventListener('keydown', e => {
        if(e.key === 'Enter'){
          e.preventDefault();
          overlay.querySelector('.cm-btn-primary')?.click();
        }
      });
    }
  });
}

function cloudHeaders(extra){

async function cloudLoad(){

async function cloudSave(data){

function freshProgress(){
  // map of moduleId -> watched hours
  const watched = {};
  const targets = {};
  SUBJECTS_DEF.forEach((s, si) => {
    s.modules.forEach((m, mi) => {
      watched[moduleId(si,mi)] = 0;
      targets[moduleId(si,mi)] = m[1];
    });
  });
  return {
    examDate: '2027-02-07',
    targetDate: '2026-12-01',
    watched,
    targets, // moduleId -> target hours (editable from the "Edit syllabus hours" section)
    open: {},
    skipped: {}, // moduleId -> true when deferred
    logs: {} // 'YYYY-MM-DD' -> { hours: number, note: string }
  };
}

function backfillState(){
  if(!state.targets) state.targets = {};
  SUBJECTS_DEF.forEach((s, si) => {
    s.modules.forEach((m, mi) => {
      const id = moduleId(si,mi);
      if(!(id in state.watched)) state.watched[id] = 0;
      if(!(id in state.targets)) state.targets[id] = m[1];
    });
  });
  if(!state.open) state.open = {};
  if(!state.skipped) state.skipped = {};
  if(!state.logs) state.logs = {};
  if(!state.examDate) state.examDate = '2027-02-07';
  if(!state.targetDate) state.targetDate = '2026-12-01';

  // Migrate older log entries (single `note` string) to the sessions-list format.
  Object.keys(state.logs).forEach(d => {
    const entry = state.logs[d];
    if(!entry.bySubject) entry.bySubject = {};
    if(!entry.sessions){
      entry.sessions = [];
      if(entry.note && entry.note.trim()){
        entry.sessions.push({ time: null, si: null, mi: null, delta: 0, note: entry.note.trim() });
      }
    }
    delete entry.note;
  });
}

    state = freshProgress();
  }
  backfillState();

  // If this device already has a sync key, pull the latest from the cloud
  // so edits made on the other device show up immediately.
  if(syncKey){
    try{
      const cloud = await cloudLoad();
      if(cloud && cloud.watched){
        state = cloud;
        backfillState();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    return;

  );
  if(choice === null) return; // dismissed
  if(choice === 'primary'){

    try{
      await cloudSave(state);

    }catch(e){
      console.error(e);

    await showPrompt(

      syncKey, { title:'Your sync key', okLabel:'Done', cancelLabel:'Done' }
    );
  } else {
    const k = await showPrompt('', '', { title:'Paste your sync key', placeholder:'Sync key', okLabel:'Connect' });
    if(!k || !k.trim()) return;
    syncKey = k.trim();
    localStorage.setItem(SYNC_KEY_STORAGE, syncKey);

function daysUntil(dateStr){
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);

}

function clampPct(a,b){ if(b<=0) return 0; return Math.min(100, Math.round((a/b)*100)); }

function moduleWatched(si, mi){
  return state.watched[moduleId(si,mi)] || 0;
}

// Target hours now live in synced state (state.targets), not just the hardcoded
// SUBJECTS_DEF — this is what lets them be edited from the UI and sync across
// devices. Falls back to the hardcoded default only if state.targets hasn't
// been seeded yet for some reason (defensive, backfillState normally handles this).
function moduleTarget(si, mi){
  const id = moduleId(si, mi);
  if(state.targets && id in state.targets) return state.targets[id];
  return SUBJECTS_DEF[si].modules[mi][1];
}

function isModuleSkipped(si, mi){
  return !!(state.skipped && state.skipped[moduleId(si, mi)]);
}

function subjectTotals(si, includeSkipped){
  const s = SUBJECTS_DEF[si];
  let target = 0, watched = 0, done = 0, skippedCount = 0, activeCount = 0;
  s.modules.forEach((m, mi) => {
    const isSkipped = isModuleSkipped(si, mi);
    if(isSkipped) skippedCount++;
    if(isSkipped && !includeSkipped){
      return; // exclude skipped modules from progress totals unless peeking
    }
    activeCount++;
    const t = moduleTarget(si, mi);
    target += t;
    const w = moduleWatched(si, mi);
    watched += w;
    if(w >= t) done++;
  });
  return {target, watched, done, total: s.modules.length, active: activeCount, skipped: skippedCount};
}

function overallStats(includeSkipped){
  let target=0, watched=0, doneModules=0, totalModules=0, skippedModules=0;
  SUBJECTS_DEF.forEach((s, si) => {
    const t = subjectTotals(si, includeSkipped);
    target += t.target; watched += t.watched;
    doneModules += t.done;
    totalModules += t.active;
    skippedModules += t.skipped;
  });
  return {target, watched, doneModules, totalModules, skippedModules, pct: clampPct(watched, target)};
}

// ---- Logging date switch ----
let loggingDate = todayStr();

// Called whenever a module's watched hours change in the Subjects section.
// Attributes the change to `loggingDate` (today, unless the logging-date
// switch has been set to a past date to backfill a forgotten/incorrect day).
// Tracks both the running daily total AND which subject it came from, so the
// weekly graph can show a per-subject breakdown. Manual edits made from the
// Daily Log form only touch `hours` (not bySubject) — the graph fills that
// gap in with a grey "manual" segment, so the bar height always stays honest.
// Total hours ever logged for a subject, across every date in history — used
// to check whether a reduction (unticking / lowering hours) is even possible,
// since logHoursDelta cascades backward through all past logs, not just today's.
function totalLoggedForSubject(si){
  let total = 0;
  Object.keys(state.logs).forEach(d => {
    const bySubject = state.logs[d] && state.logs[d].bySubject;
    if(bySubject && bySubject[si]) total += bySubject[si];
  });
  return +total.toFixed(2);
}

function logHoursDelta(si, delta){
  if(!delta) return;
  
  if (delta > 0) {
    // Addition: Add to the currently selected loggingDate
    const d = loggingDate;
    if(!state.logs[d]) state.logs[d] = { hours: 0, bySubject: {}, sessions: [] };
    if(!state.logs[d].bySubject) state.logs[d].bySubject = {};
    
    state.logs[d].hours = +((state.logs[d].hours || 0) + delta).toFixed(2);
    state.logs[d].bySubject[si] = +((state.logs[d].bySubject[si] || 0) + delta).toFixed(2);
  } else {
    // Subtraction: Try to remove from loggingDate first, then cascade to newest logs
    let remainingToSubtract = Math.abs(delta);
    
    const deductFromDate = (dateStr) => {
      if (!remainingToSubtract || !state.logs[dateStr] || !state.logs[dateStr].bySubject || !state.logs[dateStr].bySubject[si]) return;
      
      const availableHere = state.logs[dateStr].bySubject[si];
      const deduction = Math.min(availableHere, remainingToSubtract);
      
      // Update the subject specific hours
      state.logs[dateStr].bySubject[si] = +(availableHere - deduction).toFixed(2);
      if (state.logs[dateStr].bySubject[si] <= 0) delete state.logs[dateStr].bySubject[si];
      
      // Update the overall day hours
      state.logs[dateStr].hours = Math.max(0, +((state.logs[dateStr].hours || 0) - deduction).toFixed(2));
      
      // Clean up the day entry entirely if it's completely empty
      if (state.logs[dateStr].hours === 0 && (!state.logs[dateStr].sessions || state.logs[dateStr].sessions.length === 0)) {
        delete state.logs[dateStr];
      }
      
      remainingToSubtract = +(remainingToSubtract - deduction).toFixed(2);
    };

    // 1. Try to deduct from the currently selected date first
    deductFromDate(loggingDate);

    // 2. If there are still hours to subtract, cascade backwards through history
    if (remainingToSubtract > 0) {
      const sortedDates = Object.keys(state.logs).sort((a, b) => b.localeCompare(a));
      for (const dateStr of sortedDates) {
        if (remainingToSubtract <= 0) break;
        deductFromDate(dateStr);
      }
    }
  }
}

function sessionHtml(d, s, idx){
  const hasSubject = s.si !== null && s.si !== undefined && SUBJECTS_DEF[s.si] && SUBJECTS_DEF[s.si].modules[s.mi];
  const tag = hasSubject

        <button class="deleteSessionBtn" data-date="${d}" data-idx="${idx}">delete</button>
      </div>
    </div>`;
}

function dailyLogSectionHtml(){
  const dates = Object.keys(state.logs)
    .filter(d => state.logs[d].hours || (state.logs[d].sessions && state.logs[d].sessions.length))
    .sort((a,b) => b.localeCompare(a));
  const totalHrs = dates.reduce((sum,d) => sum + (state.logs[d].hours || 0), 0);

  const entriesHtml = dates.map(d => {
    const e = state.logs[d];
    const sessions = e.sessions || [];
    const sessionsHtml = sessions.length
      ? sessions.map((s, idx) => sessionHtml(d, s, idx)).join('')
      : `<div class="session-empty">No notes logged for this day.</div>`;
    return `
      <div class="log-entry">
        <div class="log-entry-top">

          <span class="log-hours">${e.hours}h</span>

      </div>`;
  }).join('') || `<div class="log-empty">No entries yet.</div>`;

  const editingSession = (editingLogDate !== null && editingSessionIdx !== null
    && state.logs[editingLogDate] && state.logs[editingLogDate].sessions
    && state.logs[editingLogDate].sessions[editingSessionIdx])
    ? state.logs[editingLogDate].sessions[editingSessionIdx] : null;
  const isEditing = !!editingSession;
  const formDate = editingLogDate || todayStr();
  const formNote = editingSession ? editingSession.note : '';

  return `
    <div class="section-head">
      <h2>Daily Log</h2>
      <span class="log-total">${totalHrs.toFixed(1)}h logged · ${dates.length} day${dates.length===1?'':'s'}</span>
    </div>
    <div class="log-hint">Whenever you add hours in Subjects, you'll be asked what you covered — skip anytime, it's optional. Use this box to add a general note for any date, or to log something after the fact.</div>
    <div class="log-form">
      <div class="log-field">
        <label for="logDateInput">Date</label>
        <input type="date" id="logDateInput" value="${formDate}" max="${todayStr()}" ${isEditing ? 'disabled' : ''}>
      </div>
      <label for="logNoteInput">Note</label>
      <textarea id="logNoteInput" rows="2" placeholder="What did you cover?">${escapeHtml(formNote)}</textarea>
      <div class="log-form-actions">
        <button id="saveLogBtn">${isEditing ? 'Update note' : 'Add note'}</button>
        ${isEditing ? '<button id="cancelLogEditBtn">cancel</button>' : ''}
      </div>
    </div>
    <details class="log-details">
      <summary>Previous entries (${dates.length})</summary>
      <div class="log-list">${entriesHtml}</div>
    </details>
  `;
}

function render(){
  const app = document.getElementById('app');
  const st = overallStats(peekSkipped);
  const examDl = daysUntil(state.examDate);
  const targetDl = daysUntil(state.targetDate);
  const hrsRemaining = Math.max(0, st.target - st.watched);
  const pace = (targetDl && targetDl > 0) ? (hrsRemaining / targetDl).toFixed(1) : (targetDl <= 0 ? 'overdue' : '—');
  const targetPaceNum = (targetDl && targetDl > 0) ? (hrsRemaining / targetDl) : null;

  app.innerHTML = `
    <header>
      <div class="title-block">
        <div class="eyebrow">Syllabus Control Panel</div>
        <h1>GATE CSE 2027</h1>
      </div>
      <div class="header-right">
        <button id="themeToggleBtn" class="theme-toggle" title="Toggle light/dark mode">${theme==='dark' ? '☀️' : '🌙'}</button>
        <div class="countdown">
          <div class="num">${examDl >= 0 ? examDl : 0}</div>
          <div class="lbl">${examDl >= 0 ? 'days to exam' : 'exam date passed'}</div>
          <input type="date" id="examDateInput" value="${state.examDate}">
        </div>
      </div>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="val amber">${st.pct}%</div>
        <div class="lbl">Hours-weighted progress</div>
      </div>
      <div class="stat-card">
        <div class="val teal">${st.watched.toFixed(1)}<span style="color:var(--muted);font-size:13px;"> / ${st.target.toFixed(0)}h</span></div>
        <div class="lbl">Lecture hours watched</div>
      </div>
      <div class="stat-card">
        <div class="val">${st.doneModules}/${st.totalModules}</div>
        <div class="lbl">Modules completed${st.skippedModules ? ` · <span style="color:var(--muted-2)">${st.skippedModules} skipped</span>` : ''}</div>
      </div>
      <div class="stat-card target-card">
        <div>
          <div class="val ${targetDl<=0 ? '' : 'amber'}" style="${targetDl<=0?'color:var(--rose);':''}">${pace}${pace!=='—'&&pace!=='overdue'?'h':''}</div>
          <div class="lbl">Hrs/day to hit your target</div>
        </div>
        <div class="target-date-row">
          <label for="targetDateInput">Your target finish date</label>
          <input type="date" id="targetDateInput" value="${state.targetDate}">
        </div>
      </div>
    </div>

    <div class="section-head">
      <h2>Subjects</h2>
      <button id="peekSkippedBtn" class="hide-skipped-btn${peekSkipped ? ' active' : ''}">${peekSkipped ? '◉ counting skipped' : '◎ include skipped in totals'}</button>
    </div>

    <div class="subjects" id="subjectGrid"></div>

    ${dailyLogSectionHtml()}

    ${syllabusTargetsSectionHtml()}

    <footer>
      <div class="footer-row">
        <span id="saveStatus" style="color:${SAVE_STATUS_LABEL[saveStatus].color}">${SAVE_STATUS_LABEL[saveStatus].text}</span>
      </div>
      <div class="footer-row">
        ${syncLinkRow()}
      </div>
      <div class="footer-row">
        <button id="exportBtn">manual backup (.json)</button>
        · <button id="importBtn">import .json</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
        · <button id="resetBtn">reset all logged hours</button>
      </div>
    </footer>
  `;

  const grid = document.getElementById('subjectGrid');

  // Tier a subject for ordering/greying purposes, based on real (non-peeked) totals
  // so peeking at skipped modules never shuffles the list:
  //   0 = still has active work left, 1 = fully completed, 2 = fully skipped
  function subjectTier(si){
    const rt = subjectTotals(si);
    if(rt.skipped === SUBJECTS_DEF[si].modules.length) return 2;
    if(rt.active > 0 && rt.done === rt.active) return 1;
    return 0;
  }
  function subjectPct(si){
    const rt = subjectTotals(si);
    return clampPct(rt.watched, rt.target);
  }

  // Order subjects so completed ones sink below active ones, and fully-skipped
  // ones sink to the very bottom. Within the incomplete tier, subjects closest
  // to done (highest progress %) come first.
  const subjectOrder = SUBJECTS_DEF.map((s, si) => si).sort((a, b) => {
    const at = subjectTier(a), bt = subjectTier(b);
    if(at !== bt) return at - bt;
    if(at === 0){
      const ap = subjectPct(a), bp = subjectPct(b);
      if(ap !== bp) return bp - ap;
    }
    return a - b;
  });

  subjectOrder.forEach((si) => {
    const s = SUBJECTS_DEF[si];
    const sid = subjectId(si);
    const t = subjectTotals(si, peekSkipped);
    const pct = clampPct(t.watched, t.target);
    const isOpen = !!state.open[sid];
    const tier = subjectTier(si);
    const fullySkipped = tier === 2;
    const subjectFullyDone = tier === 1;
    
    // Check how many hours can actually be reduced for this subject overall
    const maxRedForSubject = totalLoggedForSubject(si);

    const card = document.createElement('div');
    card.className = 'subject-card' + (isOpen ? ' open' : '') + (fullySkipped ? ' fully-skipped' : '') + (subjectFullyDone ? ' fully-done' : '');

    const subjectDone = t.active > 0 && t.done === t.active;
    const skippedHoursTotal = fullySkipped ? subjectTotals(si, true).target : 0;

    const moduleRowsHtml = s.modules.map((m, mi) => {
      const skipped = isModuleSkipped(si, mi);
      const name = m[0];
      const target = moduleTarget(si, mi);
      const watched = moduleWatched(si, mi);
      const mPct = clampPct(watched, target);
      const isDone = watched >= target;
      const atMax = watched >= target;
      const canReduceBtn = watched > 0 && maxRedForSubject >= 0.5;

      return `
        <div class="module-row${skipped ? ' skipped' : ''}">
          <div class="module-check ${isDone && !skipped ? 'done':''}"
               ${skipped ? '' : `data-action="toggle-done" data-si="${si}" data-mi="${mi}" role="checkbox" aria-checked="${isDone}" tabindex="0"`}
               style="${skipped ? 'pointer-events:none;' : ''}">${isDone && !skipped ? '✓':''}</div>
          <div class="module-body">
            <div class="module-top">
              <span class="module-name">${escapeHtml(name)}${skipped ? '<span class="skipped-badge">skipped</span>' : ''}</span>
              <span class="module-hrs ${atMax && !skipped ? 'at-max' : ''}">
                ${skipped
                  ? `${watched.toFixed(2)} / ${target}h`
                  : `<input type="number" class="hrs-input" data-action="set-hr" data-si="${si}" data-mi="${mi}" value="${watched.toFixed(2)}" min="0" max="${target}" step="0.25"> / ${target}h`
                }
              </span>
            </div>
            <div class="module-bar-row">
              <div class="bar-track" style="flex:1;"><div class="bar-fill ${skipped ? '' : (isDone ? 'done' : 'teal')}" style="width:${mPct}%"></div></div>
              <div class="module-controls">
                ${skipped ? '' : `
                  <button data-action="add-hr" data-si="${si}" data-mi="${mi}" data-amt="0.5" ${atMax?'disabled':''}>+0.5</button>
                  <button data-action="add-hr" data-si="${si}" data-mi="${mi}" data-amt="1" ${atMax?'disabled':''}>+1</button>
                  <button data-action="add-hr" data-si="${si}" data-mi="${mi}" data-amt="-0.5" ${!canReduceBtn?'disabled':''}>−0.5</button>
                `}
                <button class="${skipped ? 'unskip-btn' : 'skip-btn'}" data-action="toggle-skip" data-si="${si}" data-mi="${mi}">${skipped ? 'unskip' : 'skip'}</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    const modulesHtml = moduleRowsHtml;

    card.innerHTML = `
      <div class="subject-head" data-action="toggle-open" data-sid="${sid}">
        <div class="chevron">▶</div>
        <div class="subject-main">
          <div class="subject-name-row">
            <span class="name">${escapeHtml(s.name)}</span>
            <span class="figure">${
              fullySkipped && !peekSkipped
                ? `<span style="color:var(--muted-2)">all ${s.modules.length} skipped · ${skippedHoursTotal.toFixed(1)}h</span>`
                : `<span class="pct${subjectDone ? ' done' : ''}">${pct}%</span> · ${t.watched.toFixed(1)}/${t.target.toFixed(1)}h · ${t.done}/${t.active} modules${t.skipped ? ` · <span style="color:var(--muted-2)">${t.skipped} skipped</span>` : ''}`
            }</span>
          </div>
          <div class="bar-track"><div class="bar-fill ${subjectDone ? 'done' : 'amber'}" style="width:${pct}%"></div></div>
        </div>
      </div>
      <div class="modules-wrap">
        ${modulesHtml}
      </div>
    `;
    grid.appendChild(card);
  });

  attachHandlers();
}

function attachHandlers(){
  document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
  document.getElementById('peekSkippedBtn').addEventListener('click', togglePeekSkipped);

  document.getElementById('examDateInput').addEventListener('change', e=>{
    state.examDate = e.target.value; scheduleSave(); render();
  });
  document.getElementById('targetDateInput').addEventListener('change', e=>{
    state.targetDate = e.target.value; scheduleSave(); render();
  });

  const targetsSectionEl = document.querySelector('.targets-section');
  if(targetsSectionEl){
    targetsSectionEl.addEventListener('toggle', () => { targetsSectionOpen = targetsSectionEl.open; });
    targetsSectionEl.querySelectorAll('.targets-subject').forEach(el => {
      const si = Number(el.dataset.si);
      el.addEventListener('toggle', () => { targetsOpenSubjects[si] = el.open; });
    });
    targetsSectionEl.addEventListener('change', (e) => {
      const input = e.target.closest('.targetHoursInput');
      if(!input) return;
      const si = Number(input.dataset.si);
      const mi = Number(input.dataset.mi);
      let v = parseFloat(input.value);
      if(isNaN(v) || v < 0) v = moduleTarget(si, mi); // invalid entry — revert rather than corrupt data
      v = +v.toFixed(2);
      state.targets[moduleId(si, mi)] = v;
      
      // STRICT PARITY ENFORCEMENT:
      // If the user lowers the target hours BELOW the hours they have already watched,
      // strictly trim the excess watched hours AND deduct those hours from the graph log.
      const id = moduleId(si, mi);
      const currentWatched = state.watched[id] || 0;
      if (currentWatched > v) {
        const excess = +(currentWatched - v).toFixed(2);
        state.watched[id] = v;
        logHoursDelta(si, -excess);
        showAlert(`You lowered the target for ${SUBJECTS_DEF[si].modules[mi][0]} to ${v}h, but you already had ${currentWatched}h logged.\n\nTo keep your tracker strictly synced, the extra ${excess}h was automatically trimmed from your progress and deducted from your recent logs.`);
      }

      scheduleSave(); render();
    });
  }

  document.getElementById('exportBtn').addEventListener('click', exportData);

  document.getElementById('saveLogBtn').addEventListener('click', ()=>{
    const dateInput = document.getElementById('logDateInput');
    const noteInput = document.getElementById('logNoteInput');

    const note = noteInput.value.trim();
    if(!note){ showAlert('Write a note first (or cancel).'); return; }

    if(editingLogDate !== null && editingSessionIdx !== null){
      // Updating an existing session's text in place.
      const sess = state.logs[editingLogDate] && state.logs[editingLogDate].sessions && state.logs[editingLogDate].sessions[editingSessionIdx];
      if(sess) sess.note = note;
    } else {
      const date = dateInput.value;
      if(!date){ showAlert('Pick a date first.'); return; }
      if(!state.logs[date]) state.logs[date] = { hours: 0, bySubject: {}, sessions: [] };
      if(!state.logs[date].sessions) state.logs[date].sessions = [];
      state.logs[date].sessions.push({ time: nowTimeStr(), si: null, mi: null, delta: 0, note });
    }
    editingLogDate = null; editingSessionIdx = null;
    scheduleSave(); render();
  });

  const cancelLogEditBtn = document.getElementById('cancelLogEditBtn');
  if(cancelLogEditBtn) cancelLogEditBtn.addEventListener('click', ()=>{
    editingLogDate = null; editingSessionIdx = null;
    render();
  });

  document.querySelector('.log-list').addEventListener('click', async (e)=>{
    const editBtn = e.target.closest('.editSessionBtn');
    if(editBtn){
      editingLogDate = editBtn.dataset.date;
      editingSessionIdx = Number(editBtn.dataset.idx);
      render();
      document.getElementById('logNoteInput')?.focus();
      return;
    }
    const delBtn = e.target.closest('.deleteSessionBtn');
    if(delBtn){
      const d = delBtn.dataset.date;
      const idx = Number(delBtn.dataset.idx);
      const session = state.logs[d] && state.logs[d].sessions && state.logs[d].sessions[idx];
      if(!session) return;

      let choice = null;
      if(session.delta > 0 && session.si !== null && session.mi !== null) {
        const modName = SUBJECTS_DEF[session.si]?.modules[session.mi]?.[0] || 'the subject';
        choice = await showModal({
          title: 'Delete Entry',
          message: `This note is tied to ${session.delta}h of progress in ${modName}.\n\nDo you want to just delete the note text, or delete the note AND subtract the ${session.delta}h?`,
          buttons: [
            {label: 'Cancel', value: null, variant: 'secondary'},
            {label: 'Note Only', value: 'note', variant: 'secondary'},
            {label: 'Note & Hours', value: 'both', variant: 'primary'}
          ]
        });
      } else {
        const ok = await showConfirm('Are you sure you want to delete this note?', {title: 'Delete Note', okLabel: 'Delete', cancelLabel: 'Cancel'});
        if(ok) choice = 'note';
      }

      if(!choice) return;

      // If they opted to delete the hours as well, revert the module progress and log hours
      if(choice === 'both'){
        const id = moduleId(session.si, session.mi);
        state.watched[id] = Math.max(0, +((state.watched[id] || 0) - session.delta).toFixed(2));
        
        // Use our cascading subtractor, temporarily starting from the note's date
        const prevDate = loggingDate;
        loggingDate = d;
        logHoursDelta(session.si, -session.delta);
        loggingDate = prevDate;
      }

      // Always delete the session note itself
      if(state.logs[d] && state.logs[d].sessions){
        state.logs[d].sessions.splice(idx, 1);
        if(!state.logs[d].hours && state.logs[d].sessions.length === 0) delete state.logs[d];
      }
      if(editingLogDate === d && editingSessionIdx === idx){ editingLogDate = null; editingSessionIdx = null; }
      scheduleSave(); render();
      return;
    }
  });

  const setupSyncBtn = document.getElementById('setupSyncBtn');
  if(setupSyncBtn) setupSyncBtn.addEventListener('click', setupSync);
  const copyKeyBtn = document.getElementById('copyKeyBtn');
  if(copyKeyBtn) copyKeyBtn.addEventListener('click', copySyncKey);
  const stopSyncBtn = document.getElementById('stopSyncBtn');
  if(stopSyncBtn) stopSyncBtn.addEventListener('click', stopSync);

  const importFileInput = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', ()=>{
    importFileInput.click();
  });
  importFileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(file) importData(file);
    importFileInput.value = '';
  });

  const resetBtn = document.getElementById('resetBtn');
  resetBtn.addEventListener('click', ()=>{
    if(!resetArmed){
      resetArmed = true;
      resetBtn.textContent = 'click again to confirm reset';
      resetBtn.classList.add('confirming');
      clearTimeout(window._resetT);
      window._resetT = setTimeout(()=>{
        resetArmed = false;
        resetBtn.textContent = 'reset all logged hours';
        resetBtn.classList.remove('confirming');
      }, 3000);
      return;
    }
    // second click: actually reset
    resetArmed = false;
    clearTimeout(window._resetT);
    const keepExam = state.examDate;
    const keepTarget = state.targetDate;
    const keepLogs = state.logs; // resetting module progress shouldn't erase your daily-log history
    state = freshProgress();
    state.examDate = keepExam;
    state.targetDate = keepTarget;
    state.logs = keepLogs;
    scheduleSave(); render();
  });

  document.getElementById('subjectGrid').addEventListener('click', (e)=>{
    const toggle = e.target.closest('[data-action="toggle-open"]');
    if(toggle){
      const sid = toggle.dataset.sid;
      state.open[sid] = !state.open[sid];
      scheduleSave(); render();
      return;
    }

    const skipBtn = e.target.closest('[data-action="toggle-skip"]');
    if(skipBtn){
      const si = Number(skipBtn.dataset.si);
      const mi = Number(skipBtn.dataset.mi);
      const id = moduleId(si, mi);
      if(!state.skipped) state.skipped = {};
      if(state.skipped[id]){
        delete state.skipped[id]; // unskip
      } else {
        state.skipped[id] = true; // skip
      }
      scheduleSave(); render();
      return;
    }

    const checkbox = e.target.closest('[data-action="toggle-done"]');
    if(checkbox){
      const si = Number(checkbox.dataset.si);
      const mi = Number(checkbox.dataset.mi);
      const target = moduleTarget(si, mi);
      const id = moduleId(si, mi);
      const before = state.watched[id] || 0;
      const isDone = before >= target;
      // Click fills the bar to 100%; click again to clear it back to 0.
      const after = isDone ? 0 : target;
      
      if (after < before) {
        const maxRedForSubject = totalLoggedForSubject(si);
        if (before - after > maxRedForSubject + 0.01) {
          showAlert(`You cannot undo this module — only ${maxRedForSubject}h has ever been logged for ${SUBJECTS_DEF[si].name}, which isn't enough to cover this reduction.`);
          return;
        }
      }
      
      state.watched[id] = after;
      logHoursDelta(si, after - before);
      scheduleSave(); render();
      return;
    }
    const addBtn = e.target.closest('[data-action="add-hr"]');
    if(addBtn){
      if(addBtn.disabled) return;
      const si = Number(addBtn.dataset.si);
      const mi = Number(addBtn.dataset.mi);
      const amt = parseFloat(addBtn.dataset.amt);
      const target = moduleTarget(si, mi);
      const id = moduleId(si, mi);
      const current = state.watched[id] || 0;
      const next = Math.min(target, Math.max(0, +(current + amt).toFixed(2)));
      
      if (next < current) {
        const maxRedForSubject = totalLoggedForSubject(si);
        if (current - next > maxRedForSubject + 0.01) {
          showAlert(`You cannot reduce by ${(current - next).toFixed(1)}h — only ${maxRedForSubject}h has ever been logged for ${SUBJECTS_DEF[si].name}.`);
          return;
        }
      }
      
      state.watched[id] = next;
      logHoursDelta(si, next - current);
      scheduleSave(); render();
      return;
    }
  });

  // Keyboard support for the checkbox (it's a div with role="checkbox")
  document.getElementById('subjectGrid').addEventListener('keydown', (e)=>{
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const checkbox = e.target.closest('[data-action="toggle-done"]');
    if(!checkbox) return;
    e.preventDefault();
    checkbox.click();
  });

  // Typing an exact hours value directly into a module
  document.getElementById('subjectGrid').addEventListener('change', (e)=>{
    const input = e.target.closest('.hrs-input');
    if(!input) return;
    const si = Number(input.dataset.si);
    const mi = Number(input.dataset.mi);
    const target = moduleTarget(si, mi);
    const id = moduleId(si, mi);
    const before = state.watched[id] || 0;
    let v = parseFloat(input.value);
    if(isNaN(v)) v = before;
    v = Math.min(target, Math.max(0, +v.toFixed(2)));
    
    if (v < before) {
      const maxRedForSubject = totalLoggedForSubject(si);
      if (before - v > maxRedForSubject + 0.01) {
        showAlert(`You cannot reduce by ${(before - v).toFixed(2)}h — only ${maxRedForSubject}h has ever been logged for ${SUBJECTS_DEF[si].name}.`);
        input.value = before.toFixed(2);
        return;
      }
    }
    
    state.watched[id] = v;
    logHoursDelta(si, v - before);
    scheduleSave(); render();
  });
}

load();
</script>
</body>
</html>
